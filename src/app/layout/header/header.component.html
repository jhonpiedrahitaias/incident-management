<header class="app-header">
  <div class="app-header-bar">
    <h1 class="app-header-title">{{ systemTitle }}</h1>

    <nav class="app-header-nav" aria-label="Navegación principal">
      <ul class="app-header-nav-list">
        <li>
          <a
            class="app-header-nav-link"
            routerLink="/incidents"
            routerLinkActive="app-header-nav-link--active"
          >
            Incidencias
          </a>
        </li>
      </ul>
    </nav>

    <div class="app-header-user" appFocusWithin>
      <span class="app-header-user-name">{{ userName }}</span>
      <button
        type="button"
        class="btn app-header-toggle"
        id="user-details-toggle"
        [attr.aria-expanded]="showUserDetails()"
        aria-controls="user-details"
        (click)="toggleUserDetails()"
      >
        {{ showUserDetails() ? 'Ocultar detalles' : 'Mostrar detalles' }}
      </button>
    </div>
  </div>

  @if (showUserDetails()) {
    <p class="app-header-details" id="user-details">Sesión simulada de: {{ userName }}</p>
  }
</header>
